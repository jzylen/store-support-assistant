<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Chat Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      border: none;
      cursor: pointer;
      font-size: 24px;
      z-index: 9999;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transition: background 0.2s;
    }

    #chat-toggle:hover {
      background: #1e40af;
    }

    #chat-box {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 340px;
      height: 460px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: none;
      flex-direction: column;
      z-index: 9999;
      overflow: hidden;
    }

    #chat-header {
      background: #2563eb;
      color: white;
      padding: 16px;
      font-weight: 600;
      font-size: 15px;
    }

    #chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      margin-right: auto;
      background: #e0e7ff;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .typing {
      font-style: italic;
      font-size: 12px;
      color: #9ca3af;
      align-self: flex-start;
    }

    #chat-input {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    #chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    #chat-input button {
      padding: 0 16px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }

    #chat-input button:hover {
      background: #1e40af;
    }

    #chat-input button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<button id="chat-toggle">💬</button>

<div id="chat-box">
  <div id="chat-header">Chat with us</div>
  <div id="chat-messages"></div>
  <div id="chat-input">
    <input type="text" id="messageInput" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const API_URL = "https://store-support-backend-v2.onrender.com";
  const TOKEN = localStorage.getItem("access_token");

  const chatToggle = document.getElementById("chat-toggle");
  const chatBox = document.getElementById("chat-box");
  const messagesDiv = document.getElementById("chat-messages");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  let openedOnce = false;

  chatToggle.onclick = () => {
    chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
    if (!openedOnce) {
      addMessage("Hi 👋 I'm here to help. How can I assist you today?", "bot");
      openedOnce = true;
    }
  };

  function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = `message ${sender}`;
    msg.innerText = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.innerText = "Bot is typing…";
    messagesDiv.appendChild(typing);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    if (!TOKEN) {
      addMessage("Authentication error. Please log in again.", "bot");
      return;
    }

    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      removeTyping();
      addMessage(data.reply || "No response", "bot");

    } catch {
      removeTyping();
      addMessage("Error connecting to server.", "bot");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.onclick = sendMessage;

  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
