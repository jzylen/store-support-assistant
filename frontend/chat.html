<!DOCTYPE html>
<html>
<head>
  <title>Relixo Chat</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      height: 650px;
      background: white;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .chat-header {
      background: #2563eb;
      color: white;
      padding: 18px;
      font-weight: 600;
      font-size: 16px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .bot {
      background: #e0e7ff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background: #2563eb;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 0 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #1e40af;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    Relixo Assistant
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const API_URL = "https://store-support-backend-v2.onrender.com";
  const token = localStorage.getItem("access_token");

  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  if (!token) {
    window.location.href = "index.html";
  }

  function addMessage(text, sender, isTyping = false) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    if (isTyping) msg.classList.add("typing");
    msg.innerText = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return msg;
  }

  addMessage("Hi 👋 Welcome! How can I assist you today?", "bot");

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    const typingIndicator = addMessage("Typing...", "bot", true);

    try {
      const response = await fetch(API_URL + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      typingIndicator.remove();
      addMessage(data.reply, "bot");

    } catch (error) {
      typingIndicator.remove();
      addMessage("Something went wrong. Please try again.", "bot");
    }

    sendBtn.disabled = false;
  }

  input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
